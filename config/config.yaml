# ── Config for Market Regime Detection Project ──────────────────────────
# This file is the single source of truth for tickers, dates, model
# hyperparameters, and backtest settings. src/ modules, notebooks, and
# app.py all read from this file — no ticker or date is hardcoded in code.

tickers:
  spx: "^GSPC"
  nasdaq: "^IXIC"
  gold: "GC=F"
  bitcoin: "BTC-USD"
  vix: "^VIX"        # market-wide feature, not a tradeable asset

date_range:
  start: "2000-01-01"
  end: null            # null = most recent available trading day

model:
  n_states: 4
  covariance_type: "diag"
  n_iter: 2000
  n_init: 5             # random EM starts per fold; best training likelihood wins
  smoothing_window: 21  # trailing, not centered
  refit_cadence: "annual"
  min_train_days: 2268  # approx 9 years of initial data to capture full macro cycle
  # How each fold's hidden states become Bull / Transition / Crisis, using
  # training data only (src/models/labeling.py). "sharpe": best-earning
  # state is Bull, worst is Crisis, the rest are Bull only if they beat both
  # bull_sharpe and the asset's own training-window Sharpe. "relative"
  # (Step 6) and "absolute" (up to Step 5) anchor on volatility instead.
  labeling:
    rule: "sharpe"
    bull_sharpe: 0.2
    crisis_sharpe: -0.1
  # How much of the asset to hold in each regime (src/models/labeling.py).
  # "regime_returns": 100% in a regime whose training-window mean return was
  # positive, 0% otherwise (recomputed every fold). "p_bull": only Bull is
  # held, the sizing used up to Step 7.
  sizing: "regime_returns"
  # Regime-aware volatility targeting: multiply the regime exposure by
  # min(1, long-run vol / 20-day vol), the volatility baseline's rule.
  # Off by default: it is evaluated in scripts/compare_variants.py, and was
  # left off on purpose so the default is not chosen on test-period results.
  vol_scaling: false
  # Per-asset number of states, overriding n_states. Empty by default: one
  # model size for every asset. A training-window-only probe found Bitcoin
  # needs 6 states before a sideways state shows up in most years; that
  # option is measured in scripts/compare_variants.py, not used by default.
  n_states_by_asset: {}

backtest:
  assets: ["spx", "nasdaq", "gold", "bitcoin"]
  # What is actually bought and sold. The model reads the index (long
  # history, no fund fees), but the P&L comes from a tradable instrument:
  # adjusted prices, so dividends and the fund's own fees are included.
  # SPY tracks the S&P 500, ONEQ the NASDAQ Composite itself (QQQ would be
  # the NASDAQ-100), GLD gold bullion; Bitcoin is traded spot.
  instruments:
    spx: "SPY"
    nasdaq: "ONEQ"
    gold: "GLD"
    bitcoin: "BTC-USD"
  # Uninvested capital earns the 3-month US T-bill yield (^IRX, in percent
  # a year), and Sharpe / Sortino are measured on returns above it.
  # Without it, a strategy that is often in cash would be charged a 0%
  # return on that cash.
  cash_ticker: "^IRX"
  # Rows per year, used to annualize returns, volatility and Sharpe.
  # Equities and gold futures trade ~252 days a year; Bitcoin trades every
  # calendar day, so its daily series has ~365 rows per year. Using 252 for
  # Bitcoin would overstate how many "years" the backtest covers and
  # understate its CAGR.
  annualization:
    default: 252
    bitcoin: 365
  # Trading costs per unit of turnover (buying or selling 100% of the
  # portfolio), in basis points: half the bid-ask spread you cross plus a
  # commission. Liquid index products are cheapest; Bitcoin spreads are
  # wider. Every strategy (HMM and baselines) pays the same costs.
  costs:
    commission_bps: 0.5
    spread_bps:
      default: 2.0
      spx: 1.0
      nasdaq: 3.0       # ONEQ trades far less than SPY, so its spread is wider
      gold: 2.0
      bitcoin: 5.0

evaluation:
  # Out-of-sample results are also broken down by calendar year and by
  # these equity stress episodes. Each episode runs from an S&P 500 closing
  # high to the closing low that followed (checked against the data: the
  # start is the highest close of the prior 6 months and the end is the
  # lowest close up to a month later). They are applied as date windows to
  # every asset, so you can see how Gold and Bitcoin behaved during equity
  # stress too.
  stress_episodes:
    euro_debt_2011: ["2011-04-29", "2011-10-03"]
    china_oil_2015: ["2015-05-21", "2016-02-11"]
    q4_selloff_2018: ["2018-09-20", "2018-12-24"]
    covid_crash_2020: ["2020-02-19", "2020-03-23"]
    bear_market_2022: ["2022-01-03", "2022-10-12"]
    tariff_selloff_2025: ["2025-02-19", "2025-04-08"]
