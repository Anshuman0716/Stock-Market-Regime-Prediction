name: Tests

# Runs on every push (any branch) and on pull requests into main, so work on
# feature branches is checked before it is merged.
on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # numpy<2 (required by the pinned stack) has no wheels for 3.13.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint
      run: ruff check .

    - name: Run tests
      run: python -m pytest -v

    # README Section 1 is generated from the committed store; fail if someone
    # re-ran the pipeline without regenerating it (or edited numbers by hand).
    - name: README results match the store
      run: python scripts/update_readme.py --check

    # The notebooks read only the committed store (data/regime_store.db), so
    # they run offline. Executing them catches notebooks that drift out of
    # sync with src/ or the store schema. Once is enough, not per version.
    - name: Execute notebooks
      if: matrix.python-version == '3.12'
      run: |
        for nb in notebooks/*.ipynb; do
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1200 \
            --output-dir /tmp/executed "$nb"
        done
